name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the full stack
        run: |
          cp infra/.env.example infra/.env
          pnpm compose --profile full up -d --build
      - name: Smoke test the stack
        run: infra/smoke.sh --full
      - name: Migrate image budget
        env:
          # budget measured for this image's /app plus 10 %; raise it only with a reason in the PR.
          MIGRATE_APP_MAX_BYTES: '355000000'
        run: |
          size=$(docker run --rm --entrypoint du tms-migrate -sb /app | cut -f1)
          echo "migrate /app: ${size} bytes (budget ${MIGRATE_APP_MAX_BYTES}); whole image: $(docker image inspect -f '{{.Size}}' tms-migrate) bytes"
          if [ "$size" -gt "$MIGRATE_APP_MAX_BYTES" ]; then
            echo "::error::migrate image /app is ${size} bytes, over the ${MIGRATE_APP_MAX_BYTES} budget"
            exit 1
          fi
      - name: Install Chromium with OS dependencies
        run: pnpm --filter @tms/e2e exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm e2e
        env:
          CI: 'true'
      - name: Compose logs on failure
        if: failure()
        run: pnpm compose --profile full logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: pnpm compose --profile full down -v
