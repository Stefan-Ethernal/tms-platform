# Rendered by /core:ci-gate (ethernal core plugin). Yours to edit: a re-run never overwrites it.
# The squash commit takes the PR title, so the title must be a conventional commit.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Conventional commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PATTERN: '^(Revert ".+"|(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*)$'
        run: |
          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "::error title=PR title::Use <type>(<scope>): <summary>, matching $PATTERN"
            exit 1
          fi
