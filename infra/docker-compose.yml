name: tms

# In-network connection string, spelled once. The same user, password default and database live in
# infra/.env.example, packages/db/.env.example and the db-drift job of .github/workflows/ci.yml.
x-database-url: &database-url postgresql://tms:${POSTGRES_PASSWORD:-tms}@postgres:5432/tms

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tms}
      POSTGRES_DB: tms
    # Postgres and Mailpit publish on loopback only: dev credentials and mail stay off the LAN.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    # postgres:18 defaults PGDATA to /var/lib/postgresql/<major>/docker (and declares its
    # own VOLUME at the /var/lib/postgresql parent, not .../data) so a single volume can be
    # reused across a future major-version upgrade. Mounting the old .../data path here would
    # silently miss that directory and lose data across container recreation.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tms -d tms']
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31
    ports: # loopback only, like postgres
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot (D12, deviation 5): applies migrations, syncs the permission catalogue and seeds
  # (create-only). Never runs inside an app; the APIs start only after it exited 0.
  migrate:
    build:
      context: ..
      dockerfile: infra/docker/migrate.Dockerfile
    environment:
      DATABASE_URL: *database-url
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
    # Code stays root-owned and immutable (deviation 10); Prisma and the seed write nothing to disk.
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api-admin:
    profiles: [full]
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      args:
        APP: api-admin
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: *database-url
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      LOG_DIR: /var/log/tms
      LOG_FILE_ENABLED: 'true'
      TRUST_PROXY: 'loopback, uniquelocal'
      ADMIN_WEB_ORIGINS: 'http://localhost:8080,http://localhost:${CADDY_ADMIN_PORT:-8080}'
      SESSION_IDLE_MINUTES: '60'
      SESSION_ABSOLUTE_HOURS: '12'
      SESSION_COOKIE_SECURE: 'true'
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: 'TMS <no-reply@tms.local>'
      ADMIN_WEB_URL: 'http://localhost:${CADDY_ADMIN_PORT:-8080}'
      INVITE_TTL_HOURS: '72'
      SECRETS_ENC_KEYS: ${SECRETS_ENC_KEYS:?set in infra/.env}
      SECRETS_ENC_ACTIVE_KEY_ID: ${SECRETS_ENC_ACTIVE_KEY_ID:-stack1}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?set in infra/.env}
      TOTP_ISSUER: TMS
      LOCKOUT_THRESHOLD: '5'
      LOCKOUT_BASE_SECONDS: '900'
      LOCKOUT_MAX_SECONDS: '3600'
      THROTTLE_AUTH_IP_LIMIT: '30'
      THROTTLE_AUTH_IP_TTL_SECONDS: '60'
      THROTTLE_AUTH_ACCOUNT_LIMIT: '10'
      THROTTLE_AUTH_ACCOUNT_TTL_SECONDS: '900'
    # Read-only root filesystem (deviation 10); the writable paths are the logs volume and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - logs:/var/log/tms
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    # Journal M6-6: a crashed API comes back; `migrate` keeps restart: 'no' (one-shot).
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  api-driver:
    profiles: [full]
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      args:
        APP: api-driver
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      NODE_ENV: production
      PORT: '3002'
      DATABASE_URL: *database-url
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      LOG_DIR: /var/log/tms
      LOG_FILE_ENABLED: 'true'
      TRUST_PROXY: 'loopback, uniquelocal'
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - logs:/var/log/tms
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    # Journal M6-6: a crashed API comes back; `migrate` keeps restart: 'no' (one-shot).
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Single origin per application (D11): serves the SPA and forwards /api to its API.
  caddy:
    profiles: [full]
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - '${CADDY_ADMIN_PORT:-8080}:8080'
      - '${CADDY_KIOSK_PORT:-8081}:8081'
    depends_on:
      api-admin:
        condition: service_healthy
      api-driver:
        condition: service_healthy

volumes:
  pgdata:
  # D14: both APIs write LOG_DIR/<app>/<app>.<date>.<n>.log here; per-app directories keep
  # pino-roll's retention from deleting the other app's files (deviation 7).
  logs:
