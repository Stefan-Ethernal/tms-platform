packages:
  - apps/*
  - packages/*
  - e2e
  - tools/scripts
  - tools/claude-plugin

# pnpm 12 reads only auth and registry keys from .npmrc, so settings live here.
engineStrict: true

catalog:
  # language and tooling
  typescript: ~7.0.2
  # Classic TS 6 JS Compiler API, for ESLint's type-aware linting (typescript-eslint) via
  # .pnpmfile.cjs — see that file for why. Keep this value in sync with the range there.
  '@typescript/typescript6': ~6.0.2
  '@types/node': ^26.6.2
  eslint: ^10.11.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.70.1
  eslint-plugin-boundaries: ^7.2.0
  eslint-import-resolver-typescript: ^4.4.5
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  globals: ^17.12.0
  prettier: ^3.9.9
  turbo: ^2.11.3
  husky: ^9.1.7
  lint-staged: ^17.5.1
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  vitest: ^5.0.1
  fast-check: ^4.10.2
  zod: ^4.6.5
  dotenv: ^18.0.3
  # nest
  '@nestjs/common': ^12.1.0
  '@nestjs/core': ^12.1.0
  '@nestjs/platform-express': ^12.1.0
  '@nestjs/testing': ^12.1.0
  '@nestjs/cli': ^12.0.5
  '@nestjs/schematics': ^12.0.5
  '@nestjs/terminus': ^12.1.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  jest: ^30.5.2
  ts-jest: ^29.4.12
  '@types/jest': ^30.0.0
  supertest: ^7.3.0
  '@types/supertest': ^7.2.1
  '@types/express': ^5.0.6
  # exact: 11.0.0 is the first release with Nest 12 peers (a bare add picks 10.75.2)
  '@sentry/nestjs': 11.0.0
  # http
  cookie-parser: 1.4.7
  '@types/cookie-parser': 1.4.10
  helmet: 8.3.0
  # logging
  nestjs-pino: ^5.2.0
  pino: ^10.3.1
  pino-http: ^11.0.0
  pino-roll: ^4.0.0
  # react
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  vite: ^8.3.0
  '@vitejs/plugin-react': ^6.1.1
  jsdom: ^30.1.1
  '@testing-library/react': ^16.3.3
  '@testing-library/dom': ^10.4.2
  msw: ^2.15.0
  '@playwright/test': ^1.63.0
  # testing (Testcontainers pinned exactly: the harness was verified against 12.1.0)
  testcontainers: 12.1.0
  '@testcontainers/postgresql': 12.1.0
  # data (prisma, @prisma/client and @prisma/adapter-pg must share one exact version)
  prisma: 7.10.0
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  pg: ^8.23.0
  '@types/pg': ^8.23.1
  # domain (dual builds: every package that imports them is CommonJS, ADR-0006)
  nestjs-cls: ^7.0.0
  '@nestjs-cls/transactional': ^4.0.0
  '@nestjs-cls/transactional-adapter-prisma': ^2.0.0
  # auth-core
  '@node-rs/argon2': 2.2.1
  '@zxcvbn-ts/core': 4.2.0
  '@zxcvbn-ts/language-common': 4.1.3
  '@zxcvbn-ts/language-en': 4.1.1
  otplib: 13.5.0

# Nest CLI's build/schematics engine resolves "typescript" from the target app's own
# devDependency (not from its own package), and its programmatic compiler API doesn't
# return until TypeScript 7.1 (nest build fails: "install TypeScript 6 ... until then").
# Packages that need the JS compiler API (Nest CLI, ts-jest, direct `ts.*` calls: apps/api-*,
# packages/config and every Nest library that follows) pin the real classic package here, so
# `nest build`, `tsc`/`tsc -b` and ts-jest agree. Every other package keeps typescript@~7.0.2.
catalogs:
  nest-ts6:
    typescript: ~6.0.3

allowBuilds:
  prisma: true
  '@prisma/engines': true
  msw: true
  '@parcel/watcher': true
  unrs-resolver: true
  # testcontainers' optional native helpers; the harness works with them unbuilt (spike S3)
  ssh2: false
  cpu-features: false
  protobufjs: false

# The Prisma transaction adapter declares the CLI as a required peer, but only @prisma/client
# is needed at runtime; optional keeps the `--no-optional` API deploys valid.
packageExtensions:
  '@nestjs-cls/transactional-adapter-prisma':
    peerDependenciesMeta:
      prisma:
        optional: true

# @sentry/node depends on @sentry/bundler-plugins (source-map upload tooling, unused at runtime
# here), whose own supports-color@^8.1.1 differs from the supports-color@7.2.0 the rest of the
# workspace resolves (jest-worker included, on its own declared ^8.1.1 range — left alone below).
# That split duplicated every package downstream of @sentry/bundler-plugins's resolution, including
# @nestjs/common and @nestjs/core, into a second copy nest-bootstrap alone would load — breaking
# cross-module class identity (nestjs-pino's LoggerModule failed to resolve ApplicationConfig).
# Pinning supports-color only as resolved through @sentry/bundler-plugins (pnpm's `parent>child`
# override selector) collapses just that branch back to the version used everywhere else, without
# touching any other package's own supports-color resolution.
overrides:
  '@sentry/bundler-plugins>supports-color': 7.2.0

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.3'
  - '@turbo/darwin-arm64@2.11.3'
  - '@turbo/linux-64@2.11.3'
  - '@turbo/linux-arm64@2.11.3'
  - '@turbo/windows-64@2.11.3'
  - '@turbo/windows-arm64@2.11.3'
  - prettier@3.9.9
  - turbo@2.11.3
  - '@nestjs/cli@12.0.5'
  - '@nestjs/common@12.1.0'
  - '@nestjs/core@12.1.0'
  - '@nestjs/platform-express@12.1.0'
  - '@nestjs/schematics@12.0.5'
  - '@nestjs/testing@12.1.0'
  - supertest@7.3.0
  - dotenv@18.0.3
