packages:
  - apps/*
  - packages/*

# pnpm 12 reads only auth and registry keys from .npmrc, so settings live here.
engineStrict: true

catalog:
  # language and tooling
  typescript: ~6.0.3
  '@types/node': ^24.13.6
  eslint: ^10.11.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.70.1
  eslint-plugin-boundaries: ^7.2.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  globals: ^17.12.0
  prettier: ^3.9.9
  turbo: ^2.11.3
  vitest: ^5.0.1
  zod: ^4.6.5
  # nest
  '@nestjs/common': ^12.1.0
  '@nestjs/core': ^12.1.0
  '@nestjs/platform-express': ^12.1.0
  '@nestjs/testing': ^12.1.0
  '@nestjs/cli': ^12.0.5
  '@nestjs/schematics': ^12.0.5
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  jest: ^30.5.2
  ts-jest: ^29.4.12
  '@types/jest': ^30.0.0
  supertest: ^7.3.0
  '@types/supertest': ^7.2.1
  '@types/express': ^5.0.6
  # react
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  vite: ^8.3.0
  '@vitejs/plugin-react': ^6.1.1
  jsdom: ^30.1.1
  '@testing-library/react': ^16.3.3
  '@testing-library/dom': ^10.4.2
  msw: ^2.15.0

allowBuilds:
  esbuild: true
  msw: true
  '@parcel/watcher': true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.3'
  - '@turbo/darwin-arm64@2.11.3'
  - '@turbo/linux-64@2.11.3'
  - '@turbo/linux-arm64@2.11.3'
  - '@turbo/windows-64@2.11.3'
  - '@turbo/windows-arm64@2.11.3'
  - prettier@3.9.9
  - turbo@2.11.3
  - '@nestjs/cli@12.0.5'
  - '@nestjs/common@12.1.0'
  - '@nestjs/core@12.1.0'
  - '@nestjs/platform-express@12.1.0'
  - '@nestjs/schematics@12.0.5'
  - '@nestjs/testing@12.1.0'
  - supertest@7.3.0
